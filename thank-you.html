<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;color:#0f1f3d;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(600px 420px at 90% 10%,rgba(155,226,45,.18),transparent 65%),radial-gradient(600px 420px at 10% 90%,rgba(0,175,254,.16),transparent 65%),#f3f8fd}
.card{max-width:560px;width:100%;background:#fff;border:1px solid #e2eaf4;border-radius:24px;padding:48px 40px;text-align:center;position:relative;overflow:hidden;box-shadow:0 30px 70px -30px rgba(1,51,115,.35)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(120deg,#00affe,#0171dd 30%,#01a1a3 65%,#3bc865 85%,#9be22d)}
img{width:210px;height:auto;margin:0 auto 32px;display:block}.tick{width:64px;height:64px;border-radius:18px;margin:0 auto 22px;display:grid;place-items:center;background:linear-gradient(135deg,#0171dd,#01a1a3,#3bc865)}
h1{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;color:#013373;font-size:1.9rem;margin-bottom:12px}p{color:#5a6b88;line-height:1.6;margin-bottom:28px}.contact{font-size:.9rem}.contact a{color:#0171dd;font-weight:600;text-decoration:none}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;background:#013373;color:#fff;font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:700;text-decoration:none;font-size:.95rem}.btn:hover{background:#0171dd}</style></head>
